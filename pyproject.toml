[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "vercy-graphiti"
version = "0.1.0"
description = "Authority and disclosure for Graphiti: the Vercy Governance Overlay as edge attributes, writer attestation and an enforcing read path."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["graphiti-core>=0.30,<0.31"]
keywords = ["graphiti", "zep", "agent memory", "knowledge graph", "governance", "provenance", "access control"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
# Embedded Kuzu for the reproducible offline harness. httpx is imported by graphiti-core
# but not declared by it in 0.30.2.
offline = ["kuzu>=0.11,<0.12", "httpx"]

[project.urls]
Homepage = "https://ver.cy/overlay/"
Source = "https://github.com/ver-cy/vercy-graphiti"

[tool.hatch.build.targets.wheel]
packages = ["src/vercy_graphiti"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "bench", "fixtures", "README.md", "LICENSE", "CHANGELOG.md"]
